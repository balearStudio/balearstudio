<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Lets CSS style the pre-hydration state of animated elements without hiding
         anything from visitors or crawlers that run no JavaScript. -->
    <script>
      document.documentElement.classList.add('js')
    </script>

    <!-- Space Grotesk (OFL) is self-hosted: see @font-face in src/styles/index.css.
         Preload only the latin subset used by the main text. -->
    <link
      rel="preload"
      href="/fonts/space-grotesk-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#ffffff" />

    <!-- Per-language title, description, canonical, hreflang, Open Graph and
         JSON-LD are injected here at build time by scripts/prerender.mjs
         (see src/seo.js). `vite dev` serves the placeholder title below. -->
    <title>balearSTUDIO</title>
    <!--app-head-->
  </head>
  <body>
    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
